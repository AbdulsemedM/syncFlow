name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (Flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.27.0 ships Dart 3.6.0, the minimum supported SDK; 3.x is the
        # latest stable release. The workspace contains a Flutter package, so
        # every job needs the Flutter SDK to resolve dependencies.
        flutter-version: ['3.27.0', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - name: Install SQLite (syncflow_drift tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        if: matrix.flutter-version == '3.x'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: |
          for package in packages/*/; do
            echo "::group::$package"
            if grep -q "sdk: flutter" "$package/pubspec.yaml"; then
              (cd "$package" && flutter test --timeout=60s)
            else
              (cd "$package" && dart test)
            fi
            echo "::endgroup::"
          done
